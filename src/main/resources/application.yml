spring:
  application:
    name: mycropdiary-backend
  profiles:
    default: local
  config:
    import:
      - optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLE:false}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # [AI_CHANGE] Disable mail health indicator in actuator so health check does not fail when SMTP is offline
  health:
    mail:
      enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # [AI_CHANGE] JWT configuration - secret must be at least 64 chars for HS512
  jwt:
    secret: ${JWT_SECRET:MyCropDiaryDefaultDevelopmentSecretKeyThatIsAtLeast64CharsLong!!2026}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}       # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:2592000000} # 30 days
  # [AI_CHANGE] OTP configuration
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:15}
    length: ${OTP_LENGTH:6}

