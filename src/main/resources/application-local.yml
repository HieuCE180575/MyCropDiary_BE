spring:
  datasource:
    url: jdbc:h2:mem:mycropdiary;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS dbo
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

# [AI_CHANGE] Enable H2 console for local debugging
  h2:
    console:
      enabled: true
      path: /h2-console
